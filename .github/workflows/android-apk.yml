
name: Build PVGR TYCOON APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q PVGR-TYCOON-APK-BUILD-READY.zip

      - name: Install dependencies
        working-directory: pvgr-mobile
        run: npm install --no-audit --no-fund

      - name: Setup Android
        working-directory: pvgr-mobile
        run: npm run android:setup

      - name: Build APK
        working-directory: pvgr-mobile
        run: npm run android:debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PVGR-TYCOON-APK
          path: pvgr-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
