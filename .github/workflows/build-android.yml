
name: Gokul Supermarket Tycoon APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          mkdir -p project
          unzip -q GokulSupermarketTycoon-GitHub-Ready.zip -d project

      - name: Fix Android export settings
        run: |
          sed -i '/^gradle_build\/min_sdk=/d' project/export_presets.cfg
          sed -i '/^gradle_build\/target_sdk=/d' project/export_presets.cfg

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Import project
        run: godot --headless --editor --path project --quit

      - name: Build APK
        run: |
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" project/build/GokulSupermarketTycoon.apk

      - name: Verify APK
        run: test -f project/build/GokulSupermarketTycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GokulSupermarketTycoon-APK
          path: project/build/GokulSupermarketTycoon.apk
          if-no-files-found: error
