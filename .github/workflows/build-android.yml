
name: Build Gokul Supermarket Tycoon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          mkdir project
          unzip -q GokulSupermarketTycoon-GitHub-Ready.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Import project
        run: godot --headless --editor --path project --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path project --export-debug "Android" build/GokulSupermarketTycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GokulSupermarketTycoon-APK
          path: build/GokulSupermarketTycoon.apk
          if-no-files-found: error
